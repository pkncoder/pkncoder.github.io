<!DOCTYPE html>
<html lang="en">

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">

        <meta name="author" content="Kia Preston">
        <meta name="github" content="https://github.com/pkncoder">

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script src="./vectors.js"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

        <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
        <title>Vector Math Tool</title>
    </head>

    <body data-bs-theme="light">

        <nav class="navbar navbar-expand-lg navbar-light bg-light rounded-1 mb-3 m-2">
            <div class="container-fluid">

                <a class="navbar-brand" href="/">
                    <img src="/assets/favicon.ico" alt="" width="30" height="30" class="d-inline-block align-text-top rounded-circle">
                    Kias Cottage
                </a>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav d-flex gap-3">

                        <div class="collapse navbar-collapse">
                            <ul class="navbar-nav">
                              <li class="nav-item dropdown">
                                <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                    FRC
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="https://www.firstinspires.org/robotics/frc">What is FRC?</a></li>
                                    <li><a class="dropdown-item" href="/frc/7165/">Perkins Pirates Robotics (7165)</a></li>
                                    <li><a class="dropdown-item" href="/frc/docs/">7165 Code Docs</a></li>
                                </ul>
                              </li>
                            </ul>
                        </div>
                      
                        <li class="nav-item">
                            <a class="nav-link" href="/about-me/">About Me</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/projects/">Projects</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/shoutouts/">Shoutouts</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>

        <div class="top p-2 container">
                <div class="container">
                    <div class="d-flex mt-0 mb-auto gap-2 ">
                        <div class="card p-2 shadow">
                            <p class="card-title h2 m-3">Initial + Terminal</p>
                            <div class="card-body">
                                <form onsubmit="initialTerminalPoint()">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="initalPoint" placeholder="(2, 3)">
                                        <label for="initalPoint">Initial Point</label>
                                    </div>
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="terminalPoint" placeholder="(4, 6)">
                                        <label for="terminalPoint">Terminal Point</label>
                                    <div>
                                    <button type="submit" class="btn btn-md btn-primary mt-3">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="container">
                    <div class="d-flex mt-0 mb-auto gap-2 ">
                        <div class="card p-2 shadow">
                            <p class="card-title h2 m-3">Two Vectors</p>
                            <div class="card-body">
                                <form onsubmit="twoVectors()">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="twoVectorOne" placeholder="(2, 3)">
                                        <label for="twoVectorOne">Vector One</label>
                                    </div>
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="twoVectorTwo" placeholder="(4, 6)">
                                        <label for="twoVectorOne">Vector Two</label>
                                    <div>
                                    <button type="submit" class="btn btn-md btn-primary mt-3">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="container">
                    <div class="d-flex mt-0 mb-auto gap-2 ">
                        <div class="card p-2 shadow">
                            <p class="card-title h2 m-3">One Vector</p>
                            <div class="card-body">
                                <form onsubmit="oneVector()">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="singleVector" placeholder="(2, 3)">
                                        <label for="singleVector">Vector</label>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-md btn-primary mt-3">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </body>

</html>
